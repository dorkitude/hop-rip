[package]
name = "hop-rip"
version = "0.3.1"
edition = "2021"
description = "Tiny self-hostable URL shortener: one binary, sharded-folder key/value store, API + web app + CLI."
license = "MIT"
repository = "https://github.com/dorkitude/hop-rip"

[[bin]]
name = "hop"
path = "src/main.rs"

[lib]
name = "hop_rip"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
ureq = { version = "2", features = ["json"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }

[profile.release]
strip = true
lto = true
