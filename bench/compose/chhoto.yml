# Chhoto URL 7.10.5 (Rust + SQLite), configured as its docs recommend: WAL mode, ACID (default).
x-limits: &limits
  cgroup_parent: bench.slice
  network_mode: host
  cpus: 2
  cpuset: "0-1"
  mem_limit: 1g
  memswap_limit: 1g
services:
  chhoto:
    <<: *limits
    image: sintan1729/chhoto-url:7.10.5
    environment:
      CHHOTO_DB_URL: /data/urls.sqlite
      CHHOTO_SQLITE_USE_WAL_MODE: "True"
      CHHOTO_PASSWORD: ${CHHOTO_PASSWORD:?run bench.py, which writes bench/.env}
      CHHOTO_API_KEY: ${CHHOTO_API_KEY:?}
      CHHOTO_EXIT_ON_NO_AUTH: "True"
      CHHOTO_REDIRECT_METHOD: TEMPORARY
      CHHOTO_LISTEN_ADDRESS: 127.0.0.1
    volumes: ["${BENCH_DATA:-/srv/bench}/chhoto:/data"]
